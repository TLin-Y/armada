name: Build DTB Only

on:
  push:
    branches: 
      - test-haptics
  workflow_dispatch:

jobs:
  build-dtb:
    name: Compile Device Tree
    runs-on: ubuntu-24.04
    
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu make bc bison flex openssl libelf-dev dwarves build-essential device-tree-compiler

      - name: Build Device Tree
        # This tells GitHub Actions to run the commands inside the kernel folder
        working-directory: ./packages/kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          # Now it will correctly find and run your script
          bash scripts/build-kernel.sh qcs8550-retroidpocket-rp6.dtb

      - name: Upload Kernel Archive
        uses: actions/upload-artifact@v4
        with:
          name: rp6-kernel-archive
          # Grabs the compressed archive generated by your build script
          path: "**/*.tar.zst"